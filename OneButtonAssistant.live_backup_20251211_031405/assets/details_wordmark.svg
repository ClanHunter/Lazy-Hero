<?xml version="1.0" encoding="UTF-8"?>
<svg width="800" height="200" viewBox="0 0 800 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Wordmark: "Details" + tagline -->
  <defs>
    <linearGradient id="g1" x1="0%" x2="100%" y1="0%" y2="0%">
      <stop offset="0%" stop-color="#F0C674"/>
      <stop offset="100%" stop-color="#D99B1F"/>
    </linearGradient>
  </defs>
  <rect width="100%" height="100%" fill="none"/>
  <text x="24" y="86" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-weight="700" font-size="72" fill="#1F2937">Details</text>
  <g transform="translate(24,18)">
    <!-- small gold underline accent under the D for identity -->
    <rect x="0" y="78" width="84" height="6" rx="3" fill="url(#g1)" opacity="0.95" />
  </g>
  <text x="24" y="126" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif" font-size="14" fill="#6B7280">Most powerful, reliable, handsome, damage meter for World of Warcraft.</text>
  <!-- right-side small graph accent -->
  <g transform="translate(580,40)" fill="#D99B1F">
    <rect x="0" y="50" width="16" height="40" rx="2" fill="#E6A82F" />
    <rect x="22" y="34" width="16" height="56" rx="2" fill="#D99B1F" />
    <rect x="44" y="14" width="16" height="76" rx="2" fill="#C78A10" />
  </g>
</svg>
